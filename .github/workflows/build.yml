name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: C++17 and Python on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install analysis dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Configure Debug build
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"
      - name: Build
        run: cmake --build build/ci --config Debug --parallel 2
      - name: Run all registered tests
        run: ctest --test-dir build/ci -C Debug --output-on-failure
      - name: Check example configuration
        run: python scripts/run.py configs/local/smoke.example.toml --validate-only
